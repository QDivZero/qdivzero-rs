[package]
name = "qdivzero-rs"
version = "1.0.0"
edition = "2021"
description = "Rust client for the QDivZero API, generated from its OpenAPI specification"
license = "MIT"

[lib]
name = "qdivzero"
path = "src/lib.rs"

[dependencies]
progenitor-client = "0.14"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
progenitor = "0.14.0"
syn = "2"
prettyplease = "0.2"
serde_json = "1"
quote = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"
